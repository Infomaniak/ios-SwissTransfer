appId: com.infomaniak.swisstransfer
---
- launchApp:
    clearState: true 

- runFlow: subflows/onboarding.yaml
- runFlow: subflows/login.yaml
- runScript: setFileName.js

- runFlow:
    when:
        visible: "Start"
    commands:
        - tapOn: "Start"

- runFlow: subflows/createSteps.yaml

- tapOn: "chevron.right"

- assertVisible: ${output.fileName}

- tapOn: "Download"

- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: 0%,28%
- tapOn: "close"

- assertVisible: "Downloaded"

- stopApp