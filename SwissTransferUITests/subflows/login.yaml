appId: com.infomaniak.swisstransfer
---
- runFlow:
    when:
      visible: "Start"
    commands:
      - tapOn: "Start"

- tapOn: "My Account"
- tapOn: "Sign in"
- tapOn: "Login"

- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "example@ik.me"
    timeout: 30000
- tapOn: "example@ik.me"
- inputText: "${MAESTRO_USER}"

- extendedWaitUntil:
    visible: "Password *"
    timeout: 30000
- tapOn: "Password *"
- inputText: "${MAESTRO_PASSWORD}"

- hideKeyboard

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "Sign in"
    below: "Stay connected.*"

- extendedWaitUntil:
    notVisible: "Password \\*"
    timeout: 30000
