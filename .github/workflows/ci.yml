name: CI workflow

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test project
    runs-on: [ self-hosted, iOS ]
    env:
        DEVELOPER_DIR: /Applications/Xcode-Latest.app/Contents/Developer
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          cache: false
      - name: Verify Maestro installation
        run: maestro --version
      - name: Generate
        run: tuist install && tuist generate
      - name: Check implicit imports
        run: tuist inspect dependencies --only implicit
      - name: Build
        run: tuist build --clean "SwissTransfer"
      - name: Maestro UI tests
        env:
          SIMULATOR_MODEL: ${{ vars.LATEST_IPHONE_SIMULATOR }}
          MAESTRO_USER: ${{ secrets.UITEST_ACCOUNT_EMAIL }}
          MAESTRO_PASSWORD: ${{ secrets.UITEST_ACCOUNT_PASSWORD }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/SwissTransfer.app" -maxdepth 6 -type d | head -n1)
            [ -n "$APP_PATH" ] || { echo "SwissTransfer.app not found"; exit 1; }

            LINE=$(maestro list-devices 2>/dev/null | awk '/^iOS/{f=1; next} f && NF {print; exit}')
            MODEL=$(echo "$LINE" | awk '{print $1}')
            OS=$(echo "$LINE" | awk '{print $2}' | tr -d ',')
            MAJOR=$(echo "$OS" | cut -d- -f2)
            echo "Using $MODEL / $OS"
            
            OUTPUT=$(maestro start-device --platform ios --device-model "$MODEL" --device-os "$OS" 2>&1 | tee /dev/stderr)
            UDID=$(echo "$OUTPUT" | sed -n 's/.*UUID \([0-9A-Fa-f-]\{36\}\).*/\1/p' | head -n1)
            echo "UDID: $UDID"
            
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP_PATH"
            maestro --device "$UDID" test --config SwissTransferUITests/config.yaml SwissTransferUITests/

